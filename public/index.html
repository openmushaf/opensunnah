<!DOCTYPE html>
<html lang="en" dir="ltr">
<meta charset="utf-8">
<meta name="description" content="A free, open hadith reader. Ten collections, 26 languages, every grading shown with the scholar who gave it. No account, no tracking.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Sunnah — a free, open hadith reader</title>
<link rel="canonical" href="https://opensunnah.org/">
<link rel="icon" href="/opensunnah-favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/opensunnah-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/opensunnah-apple-touch-icon.png">
<link rel="manifest" href="/opensunnah.webmanifest">
<meta name="theme-color" content="#120E1D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --lapis:#33427E; --saffron:#E5A33A; --madder:#B0483E;
    --pearl:#EFE3CC; --verdigris:#4E8577;
    --display:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Hoefler Text',Georgia,serif;
    --ui:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --arabic:'Amiri','Scheherazade New','Traditional Arabic','Geeza Pro','Noto Naskh Arabic',serif;
    --uiLine:1.5;
  }
  html[lang="ur"]{--ui:'Noto Nastaliq Urdu',var(--arabic);--display:'Noto Nastaliq Urdu',var(--arabic);--uiLine:2.4}
  html[lang="ar"]{--ui:'Noto Naskh Arabic','Amiri','Geeza Pro',system-ui,sans-serif;--display:'Amiri',serif;--uiLine:1.9}
  html[lang="bn"]{--ui:'Noto Sans Bengali',system-ui,sans-serif;--display:'Noto Serif Bengali',Georgia,serif;--uiLine:1.8}
  html[lang="ta"]{--ui:'Noto Sans Tamil',system-ui,sans-serif;--display:'Noto Serif Tamil',Georgia,serif;--uiLine:1.8}

  *{box-sizing:border-box}
  html{height:100%}
  body{margin:0;min-height:100%;
    background-color:#0B0814;
    background-image:radial-gradient(130% 95% at 50% 2%,#241B3E 0%,#171029 42%,#0B0814 100%);
    background-repeat:no-repeat;background-attachment:fixed;
    color:var(--pearl);font-family:var(--ui);line-height:var(--uiLine);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(16px,3vw,32px) clamp(14px,3vw,34px) 36px}
  .wrap{width:100%;max-width:1260px}
  @media(min-width:1500px){.wrap{max-width:1560px}}
  @media(min-width:1900px){.wrap{max-width:1800px}}
  .eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:rgba(239,227,204,.84)}
  html[dir="rtl"] .eyebrow{letter-spacing:0;text-transform:none}

  header{display:flex;align-items:baseline;gap:.7em;flex-wrap:wrap;margin-bottom:6px}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(1.45rem,3.2vw,1.95rem);margin:0}
  .ar-title{font-family:var(--arabic);font-size:clamp(1.15rem,2.6vw,1.5rem);color:var(--saffron);opacity:.85;line-height:1}
  .loc{font-family:var(--display);font-style:italic;font-size:15px;color:rgba(239,227,204,.82);
       padding-inline-start:.7em;border-inline-start:1px solid rgba(229,163,58,.35)}
  .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(229,163,58,.3) 8%,rgba(229,163,58,.3) 92%,transparent);margin:0 0 18px}

  .density{display:flex;border:1px solid rgba(239,227,204,.13);border-radius:3px;overflow:hidden;width:max-content;margin-bottom:18px;max-width:100%}
  .den{all:unset;cursor:pointer;padding:9px 17px;display:flex;flex-direction:column;gap:3px;
       border-inline-end:1px solid rgba(239,227,204,.09);transition:background .18s;text-align:center}
  .den:last-child{border-inline-end:0}
  .den:hover{background:rgba(229,163,58,.06)}
  .den:focus-visible{outline:1px solid var(--saffron);outline-offset:-2px}
  .den .t{font-family:var(--display);font-size:.96rem;color:rgba(239,227,204,.82)}
  .den .s{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(239,227,204,.82)}
  .den[aria-pressed="true"]{background:rgba(176,72,62,.16)}
  .den[aria-pressed="true"] .t{color:var(--saffron)}
  .den[aria-pressed="true"] .s{color:rgba(239,227,204,.88)}

  .stage{display:grid;grid-template-columns:1fr 292px;gap:clamp(20px,3vw,44px);align-items:start}

  /* ── reading surface ───────────────────────────────── */
  .sheet{border:1px solid rgba(229,163,58,.2);border-radius:3px;background:rgba(11,8,20,.32);
         padding:clamp(16px,2.4vw,28px)}
  .hrow{padding:22px 6px;border-bottom:1px solid rgba(239,227,204,.09);cursor:pointer;transition:background .16s}
  .hrow:last-child{border-bottom:0}
  .hrow:hover{background:rgba(229,163,58,.045)}
  .hrow.sel{background:rgba(229,163,58,.075);box-shadow:inset 2px 0 0 var(--madder)}
  .hrow .a{font-family:var(--arabic);direction:rtl;text-align:right;font-size:clamp(1.1rem,1.7vw,1.36rem);line-height:2.3;margin:0 0 12px}
  .hrow .t{font-family:var(--display);font-size:1rem;line-height:1.75;color:rgba(239,227,204,.9);margin:0}
  .hrow .n{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:rgba(239,227,204,.82);
           margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;direction:ltr}
  @media(min-width:900px){.hrow.par{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:start}
    .hrow.par .a{margin:0}.hrow.par .n{grid-column:1/-1}}

  /* ── grade pills — the point of the whole site ─────── */
  .g{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:2px;
     font-family:var(--ui);font-size:12px;letter-spacing:.02em;border:1px solid;white-space:nowrap}
  .g.sahih{color:#8FD3A8;border-color:rgba(143,211,168,.45);background:rgba(143,211,168,.09)}
  .g.hasan{color:#9FC4E8;border-color:rgba(159,196,232,.45);background:rgba(159,196,232,.09)}
  .g.daif{color:#E89A8E;border-color:rgba(232,154,142,.5);background:rgba(232,154,142,.1)}
  .g.other{color:rgba(239,227,204,.75);border-color:rgba(239,227,204,.25)}
  .g .who{color:rgba(239,227,204,.82);font-size:12px}
  .nograde{color:rgba(239,227,204,.82);font-style:italic;font-size:12px}

  /* ── single hadith ─────────────────────────────────── */
  .solo{border:1px solid rgba(229,163,58,.2);border-radius:3px;background:rgba(11,8,20,.35);padding:clamp(22px,4vw,40px)}
  .solo .a{font-family:var(--arabic);direction:rtl;text-align:right;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:2.2;margin:0}
  .solo .div{height:1px;background:rgba(239,227,204,.14);margin:26px 0}
  .solo .t{font-family:var(--display);font-size:clamp(1rem,2.1vw,1.18rem);line-height:1.72;color:rgba(239,227,204,.96);margin:0}
  .gradebox{margin-top:26px;padding-top:20px;border-top:1px solid rgba(239,227,204,.14)}
  .gradebox .eyebrow{display:block;margin-bottom:12px}
  .gtable{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:baseline;font-size:13.5px}
  .gtable .sch{font-family:var(--display);color:rgba(239,227,204,.82);text-align:end}
  .meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:22px;font-family:var(--mono);
        font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(239,227,204,.84);direction:ltr}
  .meta .hi{color:var(--saffron)}

  /* ── study drawer ──────────────────────────────────── */
  .study{margin-top:20px;border:1px solid rgba(229,163,58,.18);border-radius:3px;padding:18px 20px;background:rgba(11,8,20,.4)}
  .study .ref{font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--saffron);margin-bottom:10px;direction:ltr}
  .tabs{display:flex;border-bottom:1px solid rgba(239,227,204,.12);margin:6px 0 12px;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;padding:8px 14px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
       color:rgba(239,227,204,.84);border-bottom:1px solid transparent;margin-bottom:-1px}
  .tab:hover{color:rgba(239,227,204,.92)}
  .tab:focus-visible{outline:1px solid var(--saffron);outline-offset:-2px}
  .tab[aria-selected="true"]{color:var(--saffron);border-bottom-color:var(--madder)}
  .cite{font-family:var(--mono);font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;
        direction:ltr;text-align:start;background:rgba(0,0,0,.3);border:1px solid rgba(239,227,204,.1);
        border-radius:3px;padding:14px 16px;color:rgba(239,227,204,.92);max-height:220px;overflow:auto}
  .cite .ai{font-family:var(--arabic);font-size:16px;direction:rtl;display:block;text-align:right;line-height:2}
  .row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}

  /* ── transport ─────────────────────────────────────── */
  .transport{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:20px;
    position:sticky;bottom:12px;z-index:5;padding:11px 18px;border-radius:34px;width:max-content;
    margin-inline:auto;background:rgba(22,15,40,.95);backdrop-filter:blur(10px);
    border:1px solid rgba(229,163,58,.3);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .turn{all:unset;cursor:pointer;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;
        background:rgba(239,227,204,.1);border:1px solid rgba(239,227,204,.42);color:var(--pearl);
        transition:background .18s,border-color .18s,color .18s}
  .turn svg{width:19px;height:19px}
  .turn:hover{background:rgba(229,163,58,.2);border-color:var(--saffron);color:var(--saffron)}
  .turn:focus-visible{outline:2px solid var(--saffron);outline-offset:3px}
  .turn[disabled],.ghost[disabled],input[disabled]{opacity:.34;cursor:not-allowed}
  .where{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--pearl);min-width:190px;text-align:center;direction:ltr}

  /* ── rail ──────────────────────────────────────────── */
  .rail{display:flex;flex-direction:column;gap:20px;position:sticky;top:18px}
  .clockwrap{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:0 auto}
  canvas{width:100%;height:100%;display:block;cursor:pointer}
  .clockmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
  .pct{font-family:var(--display);font-size:1.6rem;line-height:1}
  .pgs{font-family:var(--mono);font-size:12px;letter-spacing:.07em;color:rgba(239,227,204,.84);margin-top:6px;direction:ltr}
  .legend{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;color:rgba(239,227,204,.82)}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-top:4px}

  select,input{width:100%;background:rgba(0,0,0,.3);color:var(--pearl);font-family:var(--ui);
    border:1px solid rgba(239,227,204,.2);border-radius:3px;padding:9px 11px;font-size:14.5px}
  select:focus-visible,input:focus-visible{outline:1px solid var(--saffron);outline-offset:1px}
  .grp>.eyebrow{display:block;margin-bottom:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ghost{all:unset;cursor:pointer;text-align:center;padding:9px 14px;border:1px solid rgba(239,227,204,.2);
         border-radius:3px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:rgba(239,227,204,.82)}
  html[dir="rtl"] .ghost,html[dir="rtl"] .tab,html[dir="rtl"] .den .s{letter-spacing:0;text-transform:none;font-size:13.5px}
  .ghost:hover{border-color:rgba(229,163,58,.7);color:var(--saffron)}
  .ghost:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

  .status{display:flex;align-items:center;gap:10px;padding:10px 13px;margin-bottom:16px;
    border:1px solid rgba(239,227,204,.12);border-radius:3px;font-size:13px;color:rgba(239,227,204,.88)}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(239,227,204,.4);flex:none}
  .dot.warn{background:var(--madder);box-shadow:0 0 0 3px rgba(176,72,62,.18)}
  .status button{all:unset;margin-inline-start:auto;cursor:pointer;color:var(--saffron);border-bottom:1px solid rgba(229,163,58,.5)}
  .status.hidden{display:none}
  .hide{display:none!important}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid rgba(239,227,204,.1);
         font-size:13.5px;line-height:1.75;color:rgba(239,227,204,.82)}
  footer a{color:rgba(239,227,204,.88)}
  footer b{color:rgba(239,227,204,.88);font-weight:500}
  .support{margin-top:18px;padding-top:16px;border-top:1px solid rgba(239,227,204,.16);
           font-size:14px;line-height:1.8;color:var(--pearl);
           display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
  .support a{color:var(--saffron);text-decoration:none;border:1px solid rgba(229,163,58,.5);
             border-radius:3px;padding:8px 15px;white-space:nowrap;font-size:12.5px;letter-spacing:.03em;
             transition:background .18s,border-color .18s}
  .support a:hover{background:rgba(229,163,58,.12);border-color:var(--saffron)}

  @media(max-width:1000px){
    .stage{grid-template-columns:1fr;gap:28px}
    .rail{position:static;max-width:420px;margin:0 auto;width:100%}
  }
  @media(max-width:700px){
    .transport{gap:10px;padding:9px 12px}
    .where{min-width:110px;font-size:12px;letter-spacing:0}
    .turn{width:44px;height:44px}
    .density{width:100%}.den{flex:1;padding:9px 6px;min-width:0}
    .den .s{font-size:10px;letter-spacing:0}
    .den .t{font-size:.9rem}
    .tab,.ghost{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
    select,input{min-height:44px}
    .clockwrap{max-width:250px}
  }

  /* Last rule in the sheet so it wins on source order. .01ms rather than 0:
     a zero duration can suppress transitionend, which future code may rely on.
     The canvas is not guarded — it repaints on state change, never on a timer,
     and the grading rings are data rather than decoration. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      animation-iteration-count:1!important;
      transition-duration:.01ms!important;
      scroll-behavior:auto!important}
  }
</style>

<div class="wrap">
  <noscript><p style="max-width:60ch;margin:0 auto 28px;padding:16px 18px;border:1px solid rgba(229,163,58,.3);border-radius:3px;line-height:1.7;font-size:14px">Open Sunnah is a free, open hadith reader — ten collections, 26 interface languages, and every grading shown with the scholar who gave it. It needs JavaScript to run. Nothing here tracks you, and no account is required.</p></noscript>
  <header>
    <h1 id="brand">Open Sunnah</h1><span class="ar-title">السنّة</span>
    <span class="loc" id="loc"></span>
  </header>
  <div class="rule"></div>

  <div class="density" id="density" role="group"></div>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></div>

  <main class="stage">
    <div>
      <div class="sheet" id="sheet"></div>
      <div class="solo hide" id="solo">
        <p class="a" id="soloAr" dir="rtl" lang="ar"></p>
        <div class="div"></div>
        <p class="t" id="soloTr"></p>
        <div class="gradebox">
          <span class="eyebrow" id="l_grades">Gradings</span>
          <div class="gtable" id="gtable"></div>
        </div>
        <div class="meta" id="soloMeta"></div>
      </div>

      <div class="transport">
        <button class="turn" id="prev"></button>
        <span class="where" id="where">—</span>
        <button class="turn" id="next"></button>
      </div>

      <div class="study" id="study"></div>
    </div>

    <aside class="rail">
      <div class="grp">
        <span class="eyebrow" id="l_lang">Language</span>
        <select id="langSel"></select>
        <div id="draftNote" style="font-size:11.5px;line-height:1.5;color:#E08878;margin-top:7px"></div>
      </div>

      <div class="clockwrap">
        <canvas id="clock"></canvas>
        <div class="clockmid"><div class="pct" id="pct">—</div><div class="pgs" id="pgs"></div></div>
      </div>
      <div class="legend" id="legend"></div>

      <div class="grp">
        <span class="eyebrow" id="l_coll">Collection</span>
        <select id="collSel"></select>
        <div style="margin-top:8px"><select id="secSel"></select></div>
      </div>
      <div class="grp">
        <span class="eyebrow" id="l_goto">Go to hadith</span>
        <input type="number" id="numIn" min="1" placeholder="1035">
      </div>
      <div class="grp two">
        <button class="ghost" id="randBtn">Random</button>
        <button class="ghost" id="topBtn">Top of section</button>
      </div>
    </aside>
  </main>

  <footer id="foot"></footer>
</div>

<script>
(() => {
"use strict";
const CDN='https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  abudawud:{en:'Sunan Abu Dawud',ar:'سنن أبي داود',langs:['ara','ben','eng','fra','ind','rus','tur','urd']},
  tirmidhi:{en:'Jami at-Tirmidhi',ar:'جامع الترمذي',langs:['ara','ben','eng','ind','tur','urd']},

  nawawi:{en:'Forty Hadith of an-Nawawi',ar:'الأربعون النووية',langs:['ara','ben','eng','fra','tur']},
  qudsi:{en:'Forty Hadith Qudsi',ar:'الأربعون القدسية',langs:['ara','eng','fra']},

/* UI locales limited to languages the hadith text actually exists in.

const LANGS={
 en:{name:'English',code:'eng',dir:'ltr',rev:true,s:{

   noText:'Hadith are not available in this language — showing English.',
   prev:'Previous hadith',next:'Next hadith',
   sup:'Help keep Islamic knowledge accessible. Free, no ads, no account. %s costs $37 a year to run — the code is open.',
   supCta:'Support development'}},
 ar:{name:'العربية',code:'ara',dir:'rtl',rev:false,font:'Noto+Naskh+Arabic:wght@400;600',s:{
   m1:'باب',m1s:'قراءة الكتاب',m2:'حديث',m2s:'دراسة · درجة · اقتباس',
   lang:'اللغة',coll:'المجموعة',section:'الباب',goto:'انتقل إلى حديث',
   grades:'الدرجات',rand:'عشوائي',top:'أول الباب',
   empty:'اختر أي حديث — تظهر درجاته واقتباسه هنا.',
   copy:'نسخ الاقتباس',copied:'تم النسخ',open:'افتح هذا الحديث',see:'اعرضه في الباب',
   t1:'مختصر',t2:'كامل',t3:'اقتباس',t4:'ماركداون',
   sahih:'صحيح',hasan:'حسن',daif:'ضعيف',other:'أخرى',ungraded:'لا توجد درجة مسجّلة',
   loading:'جارٍ التحميل…',fail:'تعذّر الوصول إلى المصدر',retry:'إعادة المحاولة',
   lColl:'المجموعات · الخارج · بالحجم',lSec:'أبواب هذه المجموعة',lGrade:'درجات هذا الباب',

const LKEY='sunnah.lang', PKEY='sunnah.place.v1';
let mem=null;   /* private browsing and quota both throw; hold the place in memory rather than losing it */
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
function loadPlace(){ try{const r=lsGet(PKEY); return r?JSON.parse(r):mem;}catch(e){return mem;} }
/* mem is set unconditionally: lsSet swallows its own exception, so a catch here
   would never fire. localStorage is best-effort; memory is the session copy. */
function savePlace(p){ mem=p; lsSet(PKEY,JSON.stringify(p)); }

function detectLang(){
  const s=lsGet(LKEY); if(s&&LANGS[s]) return s;
  for(const l of (navigator.languages||['en'])){const c=String(l).toLowerCase().split('-')[0]; if(LANGS[c]) return c;}
  return 'en';
}
const state={lang:detectLang(),mode:'section',coll:'bukhari',sec:1,sel:null,tab:'full'};
const L=()=>LANGS[state.lang]; const T=k=>L().s[k];

/* ══ grade normalisation ══════════════════════════════════
   Grades are free text and vary by scholar: "Sahih", "Hasan Sahih",
   "Sahih Bukhari (1224)". Bucketing is a display aid — the exact wording
   and the scholar's name are always shown verbatim beside it. */
function bucket(g){
  const t=String(g||'').toLowerCase();
  if(/da[’'\u02bc\u2019]?if|daif|weak|munkar|matruk|mawdu|ضعيف|منكر/.test(t)) return 'daif';
  if(/hasan|حسن/.test(t) && !/sahih|صحيح/.test(t)) return 'hasan';
  if(/sahih|صحيح|bukhari|muslim/.test(t)) return 'sahih';
  if(/hasan/.test(t)) return 'hasan';
  return 'other';
}

const statusEl=$('#status'),dot=$('#dot'),statusText=$('#statusText');
function setStatus(k,t,retry){
  statusEl.classList.remove('hidden');
  dot.className='dot'+(k==='warn'?' warn':'');statusText.textContent=t;
  const o=statusEl.querySelector('button'); if(o)o.remove();
  if(retry){const b=document.createElement('button');b.textContent=T('retry');b.onclick=retry;statusEl.appendChild(b);}
}
const hideStatus=()=>statusEl.classList.add('hidden');

async function getJSON(u){const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status); return r.json();}

/* ══ data ═════════════════════════════════════════════════ */
const cache={};
function edFor(lang,coll){
  const c=COLL[coll]; const want=LANGS[lang].code;
  return (c.langs.includes(want)?want:'eng')+'-'+coll;
}
/* Bundled files under /data are plain JSON, not CDN envelopes. */
const getLocal=async u=>{const r=await fetch(u);
  if(!r.ok) throw new Error('HTTP '+r.status); return r.json();};

/* The three Forty-collections ship with the site; the other seven are 10.7 MB
   gzipped between them and stay remote. */
const BUNDLED=new Set(['nawawi','qudsi','dehlawi']);
/* Bookkeeping lives here, not on the cache entry — every consumer reads the
   same eight fields it always did, whichever stage the entry is at. */
const fullEds=new Set();      // ed keys whose hadiths[] is the complete edition
const loadedSecs={};          // ed key -> Set of section numbers already merged

/* membership by reference.book — the declared section ranges disagree with it
   in Bukhari section 0 (declared 0-0, actually 311 hadiths) */
function indexByBook(hs){
  const m={};
  hs.forEach(h=>{const b=h.reference&&h.reference.book;
    if(b===undefined||b===null) return; (m[b]=m[b]||[]).push(h);});
  return m;
}
const arIndex=ar=>{const m={}; if(ar&&ar.hadiths) ar.hadiths.forEach(h=>m[h.hadithnumber]=h.text); return m;};

async function loadColl(coll,lang){
  const ed=edFor(lang,coll), key=ed;
  if(cache[key]) return cache[key];
  setStatus('',T('loading'));

  if(BUNDLED.has(coll)){
    const [tr,ar]=await Promise.all([
      getLocal(`/data/editions/${ed}.json`),
      getLocal(`/data/editions/ara-${coll}.json`).catch(()=>null)]);
    const secs=tr.metadata.sections||tr.metadata.section||{};
    const byBook=indexByBook(tr.hadiths);
    const list=Object.keys(secs).map(Number).filter(n=>(byBook[n]||[]).length).sort((a,b)=>a-b);
    fullEds.add(key); loadedSecs[key]=new Set(list);
    return cache[key]={ed,name:tr.metadata.name,hadiths:tr.hadiths,arBy:arIndex(ar),secs,byBook,list,
                       dir:LANGS[lang].dir==='rtl'?'rtl':'ltr'};
  }

  /* stage one — index plus the one section being read. A failure here still
     reaches render()'s catch, so T('fail') and retry behave as before. */
  const idx=await getLocal(`/data/index/${coll}.json`);
  const first=idx.list.includes(state.sec)?state.sec:idx.list[0];
  const [s1,a1]=await Promise.all([
    getJSON(`${CDN}/editions/${ed}/sections/${first}.json`),
    getJSON(`${CDN}/editions/ara-${coll}/sections/${first}.json`).catch(()=>null)]);
  const hadiths=s1.hadiths||[];
  loadedSecs[key]=new Set([first]);
  const d=cache[key]={ed,name:idx.name,hadiths,arBy:arIndex(a1),secs:idx.sections,
                      byBook:indexByBook(hadiths),list:idx.list,
                      dir:LANGS[lang].dir==='rtl'?'rtl':'ltr'};
  stageTwo(key,coll,ed);
  return d;
}

/* stage two — the whole edition, in the background. On arrival the entry holds
   exactly what today's single-stage load produced. If it never arrives, stage
   one keeps working and the three whole-edition controls stay disabled. */
function stageTwo(key,coll,ed){
  Promise.all([
    getJSON(`${CDN}/editions/${ed}.min.json`),
    getJSON(`${CDN}/editions/ara-${coll}.min.json`).catch(()=>null)
  ]).then(([tr,ar])=>{
    const d=cache[key]; if(!d) return;
    /* decide BEFORE swapping: once byBook is replaced every section looks
       populated, and the question is whether it looked empty to the reader */
    const onScreen=cache[edFor(state.lang,state.coll)]===d;
    const wasEmpty=onScreen&&!inSection(d,state.sec).length;
    d.hadiths=tr.hadiths; d.arBy=arIndex(ar); d.byBook=indexByBook(tr.hadiths);
    fullEds.add(key); loadedSecs[key]=new Set(d.list);
    syncControls();
    /* only repaint if the reader was looking at something that would change —
       a section stage one never fetched. Never yank a page mid-read. */
    if(wasEmpty) render();
  }).catch(()=>{ /* stage one stands; controls stay disabled */ });
}

/* a section the reader navigated to before the whole edition landed */
async function ensureSection(d,coll,s){
  const key=d.ed;
  if(fullEds.has(key)||!loadedSecs[key]||loadedSecs[key].has(s)||!d.list.includes(s)) return;
  const [sx,ax]=await Promise.all([
    getJSON(`${CDN}/editions/${d.ed}/sections/${s}.json`),
    getJSON(`${CDN}/editions/ara-${coll}/sections/${s}.json`).catch(()=>null)]);
  if(ax&&ax.hadiths) ax.hadiths.forEach(h=>d.arBy[h.hadithnumber]=h.text);
  const have=new Set(d.hadiths.map(h=>h.hadithnumber));
  (sx.hadiths||[]).forEach(h=>{ if(!have.has(h.hadithnumber)) d.hadiths.push(h); });
  d.byBook=indexByBook(d.hadiths);
  loadedSecs[key].add(s);
}

/* Random, Go-to-hadith and hadith-mode paging read the whole edition. Until it
   lands they would act on a fraction of it, so disable rather than mislead. */
function syncControls(){
  const key=edFor(state.lang,state.coll), on=fullEds.has(key);
  $('#randBtn').disabled=!on; $('#numIn').disabled=!on;
}
const inSection=(d,s)=>d.byBook[s]||[];

/* ══ ornament ═════════════════════════════════════════════ */
const cv=$('#clock'),g2=cv.getContext('2d');
let W=0,H=0,S=1; const TAU=Math.PI*2;
function sizeClock(){const r=cv.getBoundingClientRect();S=Math.min(devicePixelRatio||1,2);
  W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
  cv.width=W*S;cv.height=H*S;g2.setTransform(S,0,0,S,0,0);paint();}
addEventListener('resize',sizeClock);
const GC={sahih:'143,211,168',hasan:'159,196,232',daif:'232,154,142',other:'239,227,204'};
function seg(cx,cy,U,r0,r1,a0,a1,fill,stroke){
  g2.beginPath();g2.arc(cx,cy,U*r1,a0,a1);g2.arc(cx,cy,U*r0,a1,a0,true);g2.closePath();
  g2.fillStyle=fill;g2.fill();
  if(stroke){g2.strokeStyle='rgba(11,8,20,.85)';g2.lineWidth=1;g2.stroke();}
}
let collSizes=null;
function paint(){
  if(!W) return;
  const cx=W/2,cy=H/2,U=Math.min(W,H)/2;
  g2.clearRect(0,0,W,H);
  const keys=Object.keys(COLL);
  const sizes=collSizes||keys.map(()=>1);
  const total=sizes.reduce((a,b)=>a+b,0);
  // outer: collections by size
  let acc=0;
  keys.forEach((k,i)=>{
    const w=sizes[i]/total;
    const a0=acc*TAU-Math.PI/2+.002,a1=(acc+w)*TAU-Math.PI/2-.002;acc+=w;
    seg(cx,cy,U,.88,1,a0,a1,k===state.coll?'rgba(176,72,62,.95)':'rgba(51,66,126,.62)',false);
  });
  const d=cache[edFor(state.lang,state.coll)];
  // middle: sections of the current collection
  if(d&&d.list.length){
    d.list.forEach((s,i)=>{
      const a0=(i/d.list.length)*TAU-Math.PI/2,a1=((i+1)/d.list.length)*TAU-Math.PI/2;
      seg(cx,cy,U,.72,.855,a0,a1,s===state.sec?'rgba(229,163,58,.9)':'rgba(51,66,126,.45)',d.list.length<=40);
    });
    // inner: grade distribution of this section
    const hs=inSection(d,state.sec);
    const tally={sahih:0,hasan:0,daif:0,other:0,none:0};
    hs.forEach(h=>{const g=(h.grades||[]).filter(x=>x&&x.grade);
      if(!g.length){tally.none++;return;} tally[bucket(g[0].grade)]++;});
    const n=hs.length||1; let a=-Math.PI/2;
    [['sahih',tally.sahih],['hasan',tally.hasan],['daif',tally.daif],['other',tally.other]].forEach(([k,v])=>{
      if(!v)return; const w=v/n*TAU; seg(cx,cy,U,.42,.68,a,a+w,`rgba(${GC[k]},.8)`,true); a+=w;
    });
    if(tally.none){const w=tally.none/n*TAU;seg(cx,cy,U,.42,.68,a,a+w,'rgba(51,66,126,.5)',true);}
    $('#pct').textContent=hs.length;
    $('#pgs').textContent=(d.secs[state.sec]||'').slice(0,34);
  }
}
cv.onclick=e=>{
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left-W/2,y=e.clientY-r.top-H/2,U=Math.min(W,H)/2;
  const dist=Math.hypot(x,y)/U; if(dist<.42) return;
  let a=Math.atan2(y,x)+Math.PI/2; if(a<0)a+=TAU;
  const keys=Object.keys(COLL);
  if(dist>=.88){
    const sizes=collSizes||keys.map(()=>1),total=sizes.reduce((p,q)=>p+q,0);
    let acc=0; for(let i=0;i<keys.length;i++){acc+=sizes[i]/total; if(a/TAU<=acc){go(keys[i],1);return;}}
    return;
  }
  const d=cache[edFor(state.lang,state.coll)];
  if(d&&d.list.length&&dist>=.72){
    const i=Math.min(d.list.length-1,Math.floor(a/TAU*d.list.length));
    go(state.coll,d.list[i]);
  }
};

/* ══ render ═══════════════════════════════════════════════ */
const chev=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d==='l'?'M15 5 L8 12 L15 19':'M9 5 L16 12 L9 19'}"/></svg>`;

function gradePills(h){
  const g=(h.grades||[]).filter(x=>x&&x.grade);
  if(!g.length) return `<span class="nograde">${esc(T('ungraded'))}</span>`;
  return g.slice(0,3).map(x=>{
    const b=bucket(x.grade);
    return `<span class="g ${b}">${esc(x.grade)}<span class="who">${esc(x.name)}</span></span>`;
  }).join('')+(g.length>3?`<span class="nograde">+${g.length-3}</span>`:'');
}

/* The turn buttons are icon-only, and they change what they step through with
   the mode: a hadith in hadith view, a section otherwise. One static label
   would be the wrong noun in the default view, so set it wherever the mode is
   known — applyLang for the default, render() on every mode change.
   Chevron direction stays in applyLang; it follows dir, not mode. */
function navLabels(){
  const byHadith=state.mode==='hadith';
  $('#prev').setAttribute('aria-label',byHadith?T('prev'):T('section')+' −');
  $('#next').setAttribute('aria-label',byHadith?T('next'):T('section')+' +');
}
async function render(){
  navLabels();
  const d=await loadColl(state.coll,state.lang).catch(e=>{setStatus('warn',T('fail')+' — '+e.message,render);return null;});
  if(!d) return;
  hideStatus();
  const usedFallback = d.ed.split('-')[0] !== L().code;
  $('#draftNote').textContent=[L().rev?'':T('draft'), usedFallback?T('noText'):'']
    .filter(Boolean).join(' · ');
  if(d.list.length && !d.list.includes(state.sec)) state.sec=d.list[0];
  /* the reader may have moved to a section stage one did not fetch */
  await ensureSection(d,state.coll,state.sec)
    .catch(e=>{setStatus('warn',T('fail')+' — '+e.message,render);});
  syncControls();
  const hs=inSection(d,state.sec);
  $('#sheet').classList.toggle('hide',state.mode!=='section');
  $('#solo').classList.toggle('hide',state.mode!=='hadith');

  if(state.mode==='section'){
    $('#sheet').innerHTML=hs.map(h=>
      `<div class="hrow par" data-n="${h.hadithnumber}">
         <p class="a" dir="rtl" lang="ar">${esc(d.arBy[h.hadithnumber]||'')}</p>
         <p class="t">${esc(h.text)}</p>
         <div class="n"><span>${esc(d.name)} ${h.hadithnumber}</span>${gradePills(h)}</div>
       </div>`).join('')||`<p style="opacity:.6;text-align:center;padding:30px">—</p>`;
    document.querySelectorAll('.hrow').forEach(el=>el.onclick=()=>select(+el.dataset.n));
    $('#where').textContent=`${T('section')} ${state.sec} · ${hs.length}`;
    const i=d.list.indexOf(state.sec);
    $('#prev').disabled=i<=0; $('#next').disabled=i>=d.list.length-1;
  } else {
    const h=d.hadiths.find(x=>x.hadithnumber===state.sel)||hs[0];
    if(h){
      state.sel=h.hadithnumber;
      $('#soloAr').textContent=d.arBy[h.hadithnumber]||'';
      $('#soloTr').textContent=h.text;
      const g=(h.grades||[]).filter(x=>x&&x.grade);
      $('#gtable').innerHTML=g.length
        ? g.map(x=>`<div class="sch">${esc(x.name)}</div><div><span class="g ${bucket(x.grade)}">${esc(x.grade)}</span></div>`).join('')
        : `<div></div><div class="nograde">${esc(T('ungraded'))}</div>`;
      $('#soloMeta').innerHTML=[`<span class="hi">${esc(d.name)}</span>`,
        `${T('section')} ${state.sec}`,`#${h.hadithnumber}`,
        h.reference?`book ${h.reference.book} · hadith ${h.reference.hadith}`:''].filter(Boolean)
        .join('<span style="opacity:.35">·</span>');
      $('#where').textContent=`${esc(d.name)} ${h.hadithnumber}`;
      const idx=d.hadiths.indexOf(h);
      $('#prev').disabled=idx<=0; $('#next').disabled=idx>=d.hadiths.length-1;
    }
  }
  $('#loc').textContent=`${d.name} · ${T('section')} ${state.sec}`;
  $('#collSel').value=state.coll;
  buildSecSel(d);
  markSel(); study(); paint();
  savePlace({coll:state.coll,sec:state.sec,sel:state.sel});
  location.hash=`${state.coll}/${state.sec}`+(state.sel?'/'+state.sel:'');
}
function markSel(){document.querySelectorAll('.hrow').forEach(el=>el.classList.toggle('sel',+el.dataset.n===state.sel));}
function select(n){state.sel=n;markSel();study();}

/* ══ citation ═════════════════════════════════════════════ */
const TABS=[['short','t1'],['full','t2'],['block','t3'],['markdown','t4']];
function citation(){
  const d=cache[edFor(state.lang,state.coll)]; if(!d||!state.sel) return '';
  const h=d.hadiths.find(x=>x.hadithnumber===state.sel); if(!h) return '';
  const g=(h.grades||[]).filter(x=>x&&x.grade);
  const gStr=g.length?g.map(x=>`${x.grade} (${x.name})`).join('; '):T('ungraded');
  const ref=`${d.name} ${h.hadithnumber}`;
  const ar=d.arBy[h.hadithnumber]||'';
  switch(state.tab){
    case 'short': return ref;
    case 'full': return `${ref}${h.reference?`, book ${h.reference.book}, hadith ${h.reference.hadith}`:''} — graded ${gStr}.`;
    case 'block': return `${ar}\n\n"${h.text}"\n\n— ${ref}\nGrading: ${gStr}`;
    default: return `> ${h.text}\n>\n> — *${ref}*\n> Grading: ${gStr}`;
  }
}
function study(){
  const d=$('#study');
  if(!state.sel){d.innerHTML=`<span style="color:rgba(239,227,204,.66);font-size:13px">${esc(T('empty'))}</span>`;return;}
  const c=cache[edFor(state.lang,state.coll)];
  const h=c&&c.hadiths.find(x=>x.hadithnumber===state.sel);
  if(!h) return;
  d.innerHTML=`<div class="ref">${esc(c.name)} ${h.hadithnumber}${h.reference?` · book ${h.reference.book} · hadith ${h.reference.hadith}`:''}</div>`+
    `<div class="n" style="display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px">${gradePills(h)}</div>`+
    `<div class="tabs" role="tablist">${TABS.map(([k,lk])=>
      `<button class="tab" type="button" role="tab" data-k="${k}" aria-selected="${k===state.tab}">${esc(T(lk))}</button>`).join('')}</div>`+
    `<div class="cite" id="citeOut"></div>`+
    `<div class="row"><button class="ghost" id="copyBtn">${esc(T('copy'))}</button>`+
    `<button class="ghost" id="openBtn">${esc(T('open'))}</button>`+
    `<button class="ghost" id="secBtn">${esc(T('see'))}</button></div>`;
  paintCite();
  d.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.k;
    d.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.k===state.tab)));paintCite();});
  $('#copyBtn').onclick=async()=>{const b=$('#copyBtn');
    try{await navigator.clipboard.writeText(citation());b.textContent=T('copied');}catch(e){}
    setTimeout(()=>b.textContent=T('copy'),1600);};
  $('#openBtn').onclick=()=>{state.mode='hadith';paintDensity();render();};
  $('#secBtn').onclick=()=>{state.mode='section';paintDensity();render();};
}
function paintCite(){
  const o=$('#citeOut'); if(!o)return; const t=citation();
  if(state.tab==='block'){const [a,...r]=t.split('\n');o.innerHTML=`<span class="ai">${esc(a)}</span>`+esc(r.join('\n'));}
  else o.textContent=t;
}

/* ══ chrome ═══════════════════════════════════════════════ */
let fontLink=null;
function applyLang(){
  const l=L();
  document.documentElement.lang=state.lang; document.documentElement.dir=l.dir;
  if(l.font){if(!fontLink){fontLink=document.createElement('link');fontLink.rel='stylesheet';document.head.appendChild(fontLink);}
    fontLink.href=`https://fonts.googleapis.com/css2?family=${l.font}&display=swap`;}
  $('#draftNote').textContent=l.rev?'':T('draft');
  $('#l_lang').textContent=T('lang');$('#l_coll').textContent=T('coll');
  $('#l_goto').textContent=T('goto');$('#l_grades').textContent=T('grades');
  /* the visible eyebrows are separate elements, so the controls themselves have
     no accessible name — label them from the same locale strings */
  $('#langSel').setAttribute('aria-label',T('lang'));
  $('#collSel').setAttribute('aria-label',T('coll'));
  $('#secSel').setAttribute('aria-label',T('section'));
  $('#numIn').setAttribute('aria-label',T('goto'));
  $('#randBtn').textContent=T('rand');$('#topBtn').textContent=T('top');
  $('#prev').innerHTML=chev(l.dir==='rtl'?'r':'l');$('#next').innerHTML=chev(l.dir==='rtl'?'l':'r');
  navLabels();
  $('#density').innerHTML='';
  [['section','m1','m1s'],['hadith','m2','m2s']].forEach(([k,a,b])=>{
    const btn=document.createElement('button');btn.className='den';btn.type='button';btn.dataset.m=k;
    btn.innerHTML=`<span class="t">${esc(T(a))}</span><span class="s">${esc(T(b))}</span>`;
    btn.onclick=()=>{state.mode=k;paintDensity();render();};
    $('#density').appendChild(btn);});
  $('#legend').innerHTML=[['sahih',GC.sahih],['hasan',GC.hasan],['daif',GC.daif],['other',GC.other]]
    .map(([k,c])=>`<i style="background:rgba(${c},.8)"></i><span>${esc(T(k))}</span>`).join('')
    +`<i style="background:rgba(51,66,126,.62)"></i><span>${esc(T('lColl'))}</span>`;
  $('#foot').innerHTML=
    `<b>Every grading is shown with the scholar who gave it.</b> A hadith is not simply “authentic” — `+
    `Al-Albani, Zubair Ali Zai and others often differ, and this site never collapses that into one verdict. `+
    `Grade colours are a display aid; the exact wording and the scholar's name are always shown verbatim.<br><br>`+
    `Text, translations and gradings from <a href="https://github.com/fawazahmed0/hadith-api" target="_blank" rel="noopener">hadith-api</a> via jsDelivr. `+
    `Ten collections; hadith text exists in nine languages, so the interface offers only those. `+
    `Nothing here is machine-translated — every translation is a published work.<br>`+
    `<span style="opacity:.85">A collection loads once, then reading is instant and offline. Bukhari and Muslim are large; the shorter collections are quick.</span>`+
    `<div class="support">${esc(T('sup')).replace('%s','Open Sunnah')} `+
    `<a href="${KOFI}" target="_blank" rel="noopener">${esc(T('supCta'))} ${l.dir==='rtl'?'←':'→'}</a></div>`;
  paintDensity();
}
function paintDensity(){[...$('#density').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===state.mode)));}
function buildSecSel(d){
  const s=$('#secSel'); if(s.dataset.for===d.ed) {s.value=state.sec; return;}
  s.dataset.for=d.ed; s.innerHTML='';
  d.list.forEach(n=>s.appendChild(Object.assign(document.createElement('option'),
    {value:n,textContent:`${n} · ${(d.secs[n]&&String(d.secs[n]).trim())||T('section')+' '+n}`})));
  s.value=state.sec;
  s.onchange=()=>go(state.coll,+s.value);
}
async function go(coll,sec,sel){state.coll=coll;state.sec=sec;state.sel=sel||null;await render();}

$('#prev').onclick=()=>{
  const d=cache[edFor(state.lang,state.coll)]; if(!d)return;
  if(state.mode==='section'){const i=d.list.indexOf(state.sec); if(i>0) go(state.coll,d.list[i-1]);}
  else{const i=d.hadiths.findIndex(x=>x.hadithnumber===state.sel); if(i>0){state.sel=d.hadiths[i-1].hadithnumber;render();}}
};
$('#next').onclick=()=>{
  const d=cache[edFor(state.lang,state.coll)]; if(!d)return;
  if(state.mode==='section'){const i=d.list.indexOf(state.sec); if(i<d.list.length-1) go(state.coll,d.list[i+1]);}
  else{const i=d.hadiths.findIndex(x=>x.hadithnumber===state.sel); if(i<d.hadiths.length-1){state.sel=d.hadiths[i+1].hadithnumber;render();}}
};
$('#numIn').onchange=()=>{
  const d=cache[edFor(state.lang,state.coll)]; if(!d)return;
  const n=+$('#numIn').value; const h=d.hadiths.find(x=>x.hadithnumber===n); if(!h)return;
  const sec=(h.reference&&h.reference.book!=null)?h.reference.book:state.sec;
  state.mode='hadith';paintDensity();go(state.coll,sec,n);
};
$('#randBtn').onclick=()=>{
  const d=cache[edFor(state.lang,state.coll)]; if(!d||!d.hadiths.length)return;
  const h=d.hadiths[Math.floor(Math.random()*d.hadiths.length)];
  const sec=(h.reference&&h.reference.book!=null)?h.reference.book:state.sec;
  state.mode='hadith';paintDensity();go(state.coll,sec,h.hadithnumber);
};
/* a CSS scroll-behavior rule does not reach behavior:'smooth' passed to
   scrollTo, so the call has to ask as well */
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#topBtn').onclick=()=>{state.mode='section';paintDensity();state.sel=null;render();window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});};
addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'){e.preventDefault();$(L().dir==='rtl'?'#prev':'#next').click();}
  if(e.key==='ArrowRight'){e.preventDefault();$(L().dir==='rtl'?'#next':'#prev').click();}
});

/* ══ boot ═════════════════════════════════════════════════ */
async function boot(){
  applyLang();
  const ls=$('#langSel');
  Object.entries(LANGS).forEach(([c,l])=>ls.appendChild(Object.assign(document.createElement('option'),{value:c,textContent:l.name})));
  ls.value=state.lang;
  ls.onchange=async()=>{state.lang=ls.value;lsSet(LKEY,state.lang);applyLang();sizeClock();await render();};

  const cs=$('#collSel');
  Object.entries(COLL).forEach(([k,v])=>cs.appendChild(Object.assign(document.createElement('option'),
    {value:k,textContent:v.en})));
  cs.onchange=()=>go(cs.value,1);

  const m=/^#([a-z]+)\/(\d+)(?:\/(\d+))?$/.exec(location.hash);
  if(m&&COLL[m[1]]){state.coll=m[1];state.sec=+m[2];if(m[3]){state.sel=+m[3];state.mode='hadith';}}
  else{
    /* a shared link wins over the stored place; mode is a fresh choice each visit.
       render() re-checks the section against d.list, so a stale section falls back
       to the collection's first rather than painting an empty one. */
    const p=loadPlace();
    if(p&&COLL[p.coll]){ state.coll=p.coll; if(Number.isInteger(p.sec)) state.sec=p.sec; if(Number.isInteger(p.sel)) state.sel=p.sel; }
  }
  paintDensity(); sizeClock();
  await render();
  // size the outer ring once the collections are known
  collSizes=Object.keys(COLL).map(k=>{
    const d=cache[edFor(state.lang,k)]; return d?Math.sqrt(d.hadiths.length):Math.sqrt(500);
  });
  paint();
}
boot();
})();
</script>
